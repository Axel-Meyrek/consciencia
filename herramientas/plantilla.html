<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Manrope:wght@400;500&display=block">
<style>
  /* Plantilla de miniaturas (Open Graph, 1200×630) y favicon. La usa miniaturas.mjs. */
  :root { --rojo: #C8102E; --ink: #16120F; --ink-2: #5A5350; }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; }
  body { font-family: "Manrope", Arial, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  em { font-style: italic; }
  .s { color: var(--rojo); font-style: italic; }

  .tarjeta {
    width: 1200px; height: 630px; position: relative; overflow: hidden; display: flex;
    background:
      repeating-linear-gradient(0deg, rgba(200,16,46,.045) 0 1px, transparent 1px 16px),
      repeating-linear-gradient(90deg, rgba(200,16,46,.045) 0 1px, transparent 1px 16px),
      #fff;
  }
  .tarjeta::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 8px; background: var(--rojo); }

  /* Artículo: texto a la izquierda, foto a la derecha */
  .texto { flex: 1; min-width: 0; padding: 60px 56px 64px 72px; display: flex; flex-direction: column; }
  .marca { font: 400 34px/1 "Cormorant Garamond", serif; letter-spacing: -.01em; }
  .cat { margin-top: 18px; font: 500 15px/1.4 "Manrope", sans-serif; letter-spacing: .22em; text-transform: uppercase; color: var(--rojo); }
  .titulo { margin-top: auto; font: 400 var(--tam, 54px)/1.06 "Cormorant Garamond", serif; letter-spacing: -.012em; text-wrap: balance; }
  .pie { margin-top: 30px; display: flex; align-items: center; gap: 18px; font: 500 14px/1 "Manrope", sans-serif; letter-spacing: .24em; text-transform: uppercase; color: var(--ink-2); }
  .pie::before { content: ""; width: 48px; height: 1px; background: var(--rojo); }
  .foto { width: 460px; flex: none; position: relative; border-left: 1px solid #ECE7E5; }
  .foto img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  /* Portada: la marca centrada sobre una curva */
  .portada { align-items: center; justify-content: center; text-align: center; }
  .portada svg { position: absolute; inset: 0; }
  .portada .contenido { position: relative; }
  .portada .nombre { font: 400 120px/.98 "Cormorant Garamond", serif; letter-spacing: -.01em; }
  .portada .nombre span { display: block; }
  .portada .desc { margin-top: 34px; font: 400 23px/1.5 "Manrope", sans-serif; color: var(--ink-2); }
  .portada .desc b { font-weight: 500; color: var(--ink); }

  /* Favicon: (s) en blanco sobre rojo */
  .icono {
    width: 180px; height: 180px; background: var(--rojo); color: #fff; display: grid; place-items: center;
    font: italic 500 132px/1 "Cormorant Garamond", serif; letter-spacing: -.04em;
  }
  .icono span { transform: translateY(-9px); }
  .icono.redondo { border-radius: 36px; }
</style>
</head>
<body>
<!-- contenido -->
</body>
</html>
